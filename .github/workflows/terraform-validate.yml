name: repo-quality

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repo-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.15.8
  TFLINT_VERSION: 0.63.1
  TRIVY_VERSION: 0.72.0
  NODE_VERSION: 24

jobs:
  learning-site:
    name: Website, assessments, visuals, and progress
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned site dependencies and verified check tools
        run: |
          python -m pip install -r requirements-site.txt
          python tools/install_check_tools.py

      - name: Validate original questions and synchronized visuals
        run: |
          python tools/validate_assessments.py
          python tools/render_site_visuals.py --check
          node --check docs/site-assets/progress.js
          node --check docs/site-assets/quiz.js
          node --test tools/tests/browser_learning.test.cjs

      - name: Stage and strictly validate the complete site
        run: |
          python tools/build_docs_site.py
          python -m mkdocs build --strict
          python tools/check_built_site.py

      - name: Scan committed history for secrets
        run: ./.check-tools/gitleaks.exe git . --redact --no-banner

  terraform-validate:
    name: Terraform format, lock, validate, and test
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Prepare Terraform provider cache
        run: |
          $cacheDirectory = Join-Path $env:RUNNER_TEMP "terraform-plugin-cache"
          New-Item -ItemType Directory -Force -Path $cacheDirectory | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "TF_PLUGIN_CACHE_DIR=$cacheDirectory"

      - name: Restore Terraform provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Terraform format, validate, and mock test
        run: .\scripts\Test-AzureFromZeroToHeroQuality.ps1 -Terraform -ReportPath artifacts\quality-terraform-report.json

      - name: Upload Terraform reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-validation-reports
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 7

  repository-quality:
    name: Documentation, PowerShell, tests, and workflows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install pinned PowerShell modules
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -AllowClobber

      - name: Install verified actionlint
        run: |
          $uri = "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_windows_amd64.zip"
          $archive = Join-Path $env:RUNNER_TEMP "actionlint.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $expectedHash = "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9"
          if ($actualHash -ne $expectedHash) { throw "actionlint checksum verification failed." }
          Expand-Archive -Path $archive -DestinationPath (Join-Path $env:RUNNER_TEMP "actionlint") -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP "actionlint")

      - name: Repository quality checks
        run: .\scripts\Test-AzureFromZeroToHeroQuality.ps1 -Docs -Curriculum -PowerShell -Pester -Actionlint -ReportPath artifacts\quality-repository-report.json

      - name: Upload repository reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-quality-reports
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 7

  markdown-quality:
    name: Markdown lint
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Markdown quality checks
        run: .\scripts\Test-AzureFromZeroToHeroQuality.ps1 -Markdown -ReportPath artifacts\quality-markdown-report.json

      - name: Upload Markdown reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: markdownlint-reports
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 7

  terraform-lint:
    name: Terraform lint
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v${{ env.TFLINT_VERSION }}
          github_token: ${{ github.token }}

      - name: Terraform lint checks
        env:
          # Authenticate plugin downloads to avoid shared-runner API rate limits.
          GITHUB_TOKEN: ${{ github.token }}
        run: .\scripts\Test-AzureFromZeroToHeroQuality.ps1 -TerraformLint -ReportPath artifacts\quality-tflint-report.json

      - name: Upload TFLint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tflint-reports
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 7

  security-scan:
    name: Terraform security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Prepare artifacts directory
        run: mkdir -p artifacts

      - name: Trivy configuration gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: config
          scan-ref: .
          version: v${{ env.TRIVY_VERSION }}
          trivyignores: .trivyignore
          severity: MEDIUM,HIGH,CRITICAL
          format: table
          output: artifacts/trivy-config-report.txt
          exit-code: "1"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-security-reports
          path: artifacts/*
          if-no-files-found: warn
          retention-days: 7
