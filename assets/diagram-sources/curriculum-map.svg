<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Azure From Zero To Hero curriculum map</title>
  <desc id="desc">The 31-lesson curriculum progresses from optional workstation setup and foundations to network, Windows compute, platform, operations, and capstone. CLZ-320 consumes remote state created in CLZ-310.</desc>
  <style>.bg{fill:#f8fafc}.lane{fill:#fff;stroke:#cbd5e1;stroke-width:2}.step{fill:#dbeafe;stroke:#2563eb;stroke-width:3}.adv{fill:#ecfdf5;stroke:#059669;stroke-width:3}.dep{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.arrow{stroke:#ea580c;stroke-width:3;fill:none}.text{font:700 23px Arial,sans-serif;fill:#111827}.small{font:17px Arial,sans-serif;fill:#374151}.tiny{font:15px Arial,sans-serif;fill:#374151}</style>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text class="text" x="40" y="55">31-Lesson Learning Path</text>
  <rect class="lane" x="60" y="95" width="1080" height="360" rx="16"/>
  <g transform="translate(95 135)">
    <rect class="step" width="180" height="95" rx="12"/><text class="text" x="36" y="42">090-160</text><text class="small" x="30" y="70">foundations</text>
    <rect class="step" x="210" width="180" height="95" rx="12"/><text class="text" x="247" y="42">170-180</text><text class="small" x="258" y="70">network</text>
    <rect class="step" x="420" width="180" height="95" rx="12"/><text class="text" x="457" y="42">190-270</text><text class="small" x="462" y="70">Windows</text>
    <rect class="adv" x="630" width="180" height="95" rx="12"/><text class="text" x="667" y="42">280-350</text><text class="small" x="665" y="70">platform</text>
    <rect class="adv" x="840" width="180" height="95" rx="12"/><text class="text" x="877" y="42">360-390</text><text class="small" x="875" y="70">operate</text>
  </g>
  <text class="small" x="95" y="285">Explicit cross-lesson state exercise</text>
  <rect class="dep" x="320" y="310" width="200" height="70" rx="10"/>
  <text class="text" x="371" y="342">CLZ-310</text>
  <text class="tiny" x="349" y="365">backend producer</text>
  <line class="arrow" x1="535" y1="345" x2="665" y2="345"/>
  <polygon points="665,345 647,335 647,355" fill="#ea580c"/>
  <rect class="dep" x="680" y="310" width="200" height="70" rx="10"/>
  <text class="text" x="731" y="342">CLZ-320</text>
  <text class="tiny" x="716" y="365">state consumer</text>
  <text class="tiny" x="95" y="425">Other deployable lessons own their lifecycle; local/readiness lessons create no Azure resources.</text>
</svg>
