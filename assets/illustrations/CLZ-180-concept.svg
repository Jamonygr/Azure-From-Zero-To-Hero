<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">CLZ-180 · Network Security Groups</title><desc id="desc">Three illustrated inbound requests pass through ordered NSG decisions: priority 100 permits Internet TCP 80, priority 110 permits TCP 3389 from admin_cidr, and priority 120 denies other TCP 3389 sources. The NSG is associated with web-snet; no VM is present. First matching rule wins, and /32 validation checks format rather than public routability.</desc><metadata>{&quot;connectionInventory&quot;: [&quot;priority = 100&quot;, &quot;priority = 110&quot;, &quot;priority = 120&quot;, &quot;source_address_prefix = var.admin_cidr&quot;, &quot;destination_port_range = \&quot;3389\&quot;&quot;, &quot;subnet_id = azurerm_subnet.web.id&quot;, &quot;network_security_group_id = azurerm_network_security_group.web.id&quot;], &quot;deploymentMode&quot;: &quot;Azure deployment&quot;, &quot;lessonId&quot;: &quot;CLZ-180&quot;, &quot;resourceInventory&quot;: [&quot;azurerm_network_security_group.web&quot;, &quot;azurerm_network_security_rule.allow_admin_rdp&quot;, &quot;azurerm_network_security_rule.allow_http&quot;, &quot;azurerm_network_security_rule.deny_other_rdp&quot;, &quot;azurerm_resource_group.lab&quot;, &quot;azurerm_subnet.app&quot;, &quot;azurerm_subnet.data&quot;, &quot;azurerm_subnet.mgmt&quot;, &quot;azurerm_subnet.web&quot;, &quot;azurerm_subnet_network_security_group_association.web&quot;, &quot;azurerm_virtual_network.main&quot;], &quot;sourceFiles&quot;: [&quot;CLZ-180-network-security-groups/README.md&quot;, &quot;CLZ-180-network-security-groups/locals.tf&quot;, &quot;CLZ-180-network-security-groups/outputs.tf&quot;, &quot;CLZ-180-network-security-groups/providers.tf&quot;, &quot;CLZ-180-network-security-groups/resource-group.tf&quot;, &quot;CLZ-180-network-security-groups/security.tf&quot;, &quot;CLZ-180-network-security-groups/variables.tf&quot;, &quot;CLZ-180-n