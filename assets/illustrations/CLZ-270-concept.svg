ans-serif" font-size="25" font-weight="500" text-anchor="middle">5-minute metric window + 5-minute cooldown</text><text x="40" y="675" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Solid: shown relationship   ·   Dashed: illustrative / not deployed   ·   Dotted: lookup or inspection</text><text x="40" y="710" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Solid arrows = the autoscale control path; dotted arrow = observed platform metrics.</text><text x="40" y="735" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Capacity bounds limit instance count, not currency spend. Review later Terraform plans for</text><text x="40" y="760" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">capacity drift.</text></svg>
