64 226H1121" stroke="#60e0e5" stroke-width="2.6" opacity="0.7"/><g transform="translate(963.5 238) scale(0.690476)" fill="none" stroke="#60e0e5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="35" cy="34" r="24"/><path d="m52 52 23 23M23 29h24M23 40h16"/></g><text x="992.5" y="308" fill="#edf4ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">CLZ-320 state reader</text><text x="992.5" y="333" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">Entra ID; exported root</text><text x="992.5" y="355" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">outputs</text></g><g data-node="own"><rect x="850" y="472" width="295" height="170" rx="18" fill="#030711"/><rect x="845" y="465" width="295" height="170" rx="18" fill="url(#nodeFill)" stroke="#b39bff" stroke-width="1.7"/><path d="M864 466H1121" stroke="#b39bff" stroke-width="2.6" opacity="0.7"/><g transform="translate(963.5 478) scale(0.690476)" fill="none" stroke="#b39bff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 23V13h26l10 10h32v47H8Zm0 10h68"/></g><text x="992.5" y="548" fill="#edf4ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Consumer resource</text><text x="992.5" y="574" fill="#edf4ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">group</text><text x="992.5" y="599" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">CLZ-320 owns its local state</text></g><g transform="translate(65 470) scale(0.857143)" fill="none" stroke="#60e0e5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m42 7 28 12v23c0 17-14 28-28 35C28 70 14 59 14 42V19Z"/><path d="m27 41 11 11 20-25"/></g><text x="165" y="477" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Backend coordinates are not the state</text><text x="165" y="505" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">snapshot.</text><text x="165" y="535" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start">Remote-state access can expose the whole</text><text x="165" y="561" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start">producer snapshot.</text><text x="40" y="675" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Solid: shown relationship   ·   Dashed: illustrative / not deployed   ·   Dotted: lookup or inspection</text><text x="40" y="710" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">The consumer reads CLZ-310 output metadata; it does not own or migrate the producer</text><text x="40" y="735" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">backend. Destroy CLZ-320 before CLZ-310&#x27;s migration-back cleanup.</text></svg>
