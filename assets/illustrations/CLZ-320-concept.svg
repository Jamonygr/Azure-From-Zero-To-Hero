9&quot;, &quot;CLZ-320-cross-environment-state/remote-state-data.tf&quot;: &quot;c599eb982c7d2aa73fcc4856b89a2d7e0ea961924ad4af4a816140ffd17eec9a&quot;, &quot;CLZ-320-cross-environment-state/resource-group.tf&quot;: &quot;122a7af4621c9811c122acd852fd6e4bb42b31385806b4222b06c98aadff73e4&quot;, &quot;CLZ-320-cross-environment-state/variables.tf&quot;: &quot;6499b793a9c39bc46d9059ceb0386a73b8c2468d496bbff73742381b8b72904e&quot;, &quot;CLZ-320-cross-environment-state/versions.tf&quot;: &quot;00759f2ff650a979ee48a3205c25f156aec905eba51d99fbde904d2011b05fd6&quot;}, &quot;sourceSha256&quot;: &quot;dea0bf364116a47c4a4e25746f9e07350ce41fdff149ad389914c47dde225482&quot;, &quot;sourceValidation&quot;: &quot;Curated resource addresses and connection expressions, with source fingerprints; no live Azure test.&quot;, &quot;visualConnections&quot;: [{&quot;from&quot;: &quot;producer&quot;, &quot;label&quot;: &quot;metadata&quot;, &quot;style&quot;: &quot;dotted&quot;, &quot;to&quot;: &quot;coordinates&quot;}, {&quot;from&quot;: &quot;coordinates&quot;, &quot;label&quot;: &quot;contract&quot;, &quot;style&quot;: &quot;dotted&quot;, &quot;to&quot;: &quot;reader&quot;}, {&quot;from&quot;: &quot;reader&quot;, &quot;label&quot;: &quot;own lifecycle&quot;, &quot;style&quot;: &quot;solid&quot;, &quot;to&quot;: &quot;own&quot;}]}</metadata><defs><linearGradient id="nodeFill" x2="0" y2="1"><stop stop-color="#172a44"/><stop offset="1" stop-color="#101b30"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#17243a" stroke-width="0.7"/></pattern><marker id="solidArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 7 3.5-7 3.5" fill="none" stroke="#60e0e5" stroke-width="2"/></marker><marker id="dashedArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 7 3.5-7 3.5" fill="none" stroke="#b39b