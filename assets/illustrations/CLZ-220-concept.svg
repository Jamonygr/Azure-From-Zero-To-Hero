ill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Solid: shown relationship   ·   Dashed: illustrative / not deployed   ·   Dotted: lookup or inspection</text><text x="40" y="710" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Solid arrows = traffic and the explicit egress path; dotted arrows = TCP health probes.</text><text x="40" y="735" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Both backends can use the outbound rule. A TCP probe does not validate the HTTP body.</text></svg>
