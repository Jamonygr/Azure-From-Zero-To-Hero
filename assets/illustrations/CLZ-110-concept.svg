ta</text><text x="1000" y="563" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">scope + VM capacity</text></g><text x="40" y="675" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Solid: shown relationship   ·   Dashed: illustrative / not deployed   ·   Dotted: lookup or inspection</text><text x="40" y="710" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Terraform emits readiness commands locally; run the CLI checks explicitly from PowerShell.</text><text x="40" y="735" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Select by subscription GUID. The checks deploy, register, and delete nothing in Azure.</text></svg>
