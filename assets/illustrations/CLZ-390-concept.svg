<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">CLZ-390 · Final Windows Reference Architecture</title><desc id="desc">Public HTTP passes through the Standard Load Balancer and web NSG to private IIS VMSS instances; Bastion supplies the separately admitted RDP path. A generated password feeds VMSS and Key Vault and remains in state. Outbound SNAT is explicit. Log Analytics is a workspace without telemetry wiring; autoscale and managed TLS are production additions.</desc><metadata>{&quot;connectionInventory&quot;: [&quot;subnet_id = module.network.web_subnet_id&quot;, &quot;admin_password = random_password.windows_admin.result&quot;, &quot;source_address_prefix = \&quot;10.40.20.0/26\&quot;&quot;, &quot;destination_port_range = \&quot;3389\&quot;&quot;, &quot;disable_outbound_snat = true&quot;, &quot;resource \&quot;azurerm_lb_outbound_rule\&quot; \&quot;web\&quot;&quot;, &quot;protocol = \&quot;Tcp\&quot;&quot;], &quot;deploymentMode&quot;: &quot;Capstone Azure deployment&quot;, &quot;lessonId&quot;: &quot;CLZ-390&quot;, &quot;resourceInventory&quot;: [&quot;azurerm_bastion_host.main&quot;, &quot;azurerm_key_vault.lab&quot;, &quot;azurerm_key_vault_secret.windows_admin_password&quot;, &quot;azurerm_log_analytics_workspace.main&quot;, &quot;azurerm_network_security_group.web&quot;, &quot;azurerm_public_ip.bastion&quot;, &quot;azurerm_subnet.bastion&quot;, &quot;azurerm_subnet_network_security_group_association.web&quot;, &quot;module.network&quot;, &quot;module.windows_iis_vmss&quot;, &quot;random_password.windows_admin&quot;], &quot;sourceFiles&quot;: [&quot;CLZ-390-final-windows-reference-architecture/README.md&quot;, &quot;CLZ-390-final-windows-reference-architecture/capstone.tf&quot;, &quot;CLZ-390-final-windows-reference-architecture/locals.tf&quot;, &quot;CLZ-390-final-windows-reference-architecture/outputs.tf&quot;, &quot;CLZ-390-final-windows-reference-architectu