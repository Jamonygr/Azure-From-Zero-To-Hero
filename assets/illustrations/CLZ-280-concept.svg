ll="#edf4ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Internet</text></g><text x="75" y="490" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">app / data / mgmt</text><text x="75" y="535" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">No NAT association</text><g transform="translate(490 485) scale(0.785714)" fill="none" stroke="#60e0e5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="35" cy="34" r="24"/><path d="m52 52 23 23M23 29h24M23 40h16"/></g><text x="580" y="505" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500" text-anchor="start">Validate the subnet link and public IP.</text><text x="40" y="675" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Solid: shown relationship   ·   Dashed: illustrative / not deployed   ·   Dotted: lookup or inspection</text><text x="40" y="710" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">NAT is outbound connectivity, not inbound access or a filtering firewall. This lesson</text><text x="40" y="735" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">creates no workload for an egress test.</text></svg>
