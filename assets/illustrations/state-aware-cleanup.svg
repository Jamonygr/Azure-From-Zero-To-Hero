<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1430" viewBox="0 0 700 1430" role="img" aria-labelledby="title desc"><title id="title">Clean up in dependency order</title><desc id="desc">Terraform state is the boundary for this course. Arrows describe learning order, not Azure network traffic.</desc><rect width="700" height="1430" rx="25" fill="#080e1b"/><rect x="14" y="14" width="672" height="1402" rx="20" fill="none" stroke="#293c5c"/><text x="35" y="57" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="750">Clean up in dependency order</text><text x="35" y="155" fill="#b8cbea" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500">Terraform state is the boundary for this course</text><rect x="30" y="260" width="640" height="180" rx="19" fill="#111c30" stroke="#293c5c"/><circle cx="95" cy="324" r="49" fill="#12263c" stroke="#60e0e5"/><g transform="translate(58 287) scale(0.8809523809523809)" fill="none" stroke="#60e0e5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="19" y="8" width="46" height="68" rx="8"/><path d="M30 25h24M30 38h24M30 51h14m-14 12h24"/></g><text x="161" y="304" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">01  Read the cleanup section</text><text x="161" y="337" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Keep the correct lesson and workspace</text><path d="M95 444v19m-5-5 5 5 5-5" fill="none" stroke="#60e0e5" stroke-width="2"/><rect x="30" y="470" width="640" height="180" rx="19" fill="#111c30" stroke="#293c5c"/><circle cx="95" cy="534" r="49" fill="#12263c" stroke="#b39bff"/><g transform="translate(58 497) scale(0.8809523809523809)" fill="none" stroke="#b39bff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="35" cy="34" r="23"/><path d="m52 52 24 24M23 29h24M23 39h17"/></g><text x="161" y="514" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">02  Review managed objects</text><text x="161" y="547" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Use the intended state and subscription</text><path d="M95 654v19m-5-5 5 5 5-5" fill="none" stroke="#60e0e5" stroke-width="2"/><rect x="30" y="680" width="640" height="180" rx="19" fill="#111c30" stroke="#293c5c"/><circle cx="95" cy="744" r="49" fill="#12263c" stroke="#61caff"/><g transform="translate(58 707) scale(0.8809523809523809)" fill="none" stroke="#61caff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 24h46l-4 51H23Zm-6-8h58M32 16V8h20v8M33 36v24m18-24v24"/></g><text x="161" y="724" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">03  Destroy dependent labs</text><text x="161" y="759" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">first</text><text x="161" y="792" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">CLZ-320 must finish before CLZ-310</text><path d="M95 864v19m-5-5 5 5 5-5" fill="none" stroke="#60e0e5" stroke-width="2"/><rect x="30" y="890" width="640" height="180" rx="19" fill="#111c30" stroke="#293c5c"/><circle cx="95" cy="954" r="49" fill="#12263c" stroke="#60e0e5"/><g transform="translate(58 917) scale(0.8809523809523809)" fill="none" stroke="#60e0e5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="42" cy="17" rx="27" ry="10"/><path d="M15 17v47c0 13 54 13 54 0V17M15 39c0 13 54 13 54 0"/></g><text x="161" y="934" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">04  Migrate the backend back</text><text x="161" y="967" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Follow CLZ-310 before removing storage</text><path d="M95 1074v19m-5-5 5 5 5-5" fill="none" stroke="#60e0e5" stroke-width="2"/><rect x="30" y="1100" width="640" height="180" rx="19" fill="#111c30" stroke="#293c5c"/><circle cx="95" cy="1164" r="49" fill="#12263c" stroke="#b39bff"/><g transform="translate(58 1127) scale(0.8809523809523809)" fill="none" stroke="#b39bff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="10" width="68" height="49" rx="8"/><path d="M42 59v14m-19 0h38M18 44l13-13 10 8 22-18"/></g><text x="161" y="1144" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">05  Audit resources and cost</text><text x="161" y="1177" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Verify removal and any retained items</text><text x="35" y="1345" fill="#c4d7f4" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Do not delete the remote backend while another lesson</text><text x="35" y="1375" fill="#c4d7f4" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">still depends on it.</text></svg>
