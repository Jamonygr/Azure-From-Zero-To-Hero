ata"><rect x="460" y="467" width="300" height="145" rx="18" fill="#030711"/><rect x="455" y="460" width="300" height="145" rx="18" fill="url(#nodeFill)" stroke="#61caff" stroke-width="1.7"/><path d="M474 461H736" stroke="#61caff" stroke-width="2.6" opacity="0.7"/><g transform="translate(576 473) scale(0.690476)" fill="none" stroke="#61caff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="35" cy="34" r="24"/><path d="m52 52 23 23M23 29h24M23 40h16"/></g><text x="605" y="543" fill="#edf4ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Inspect metadata</text><text x="605" y="568" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">Secret ID and enabled state</text></g><g transform="translate(950 435) scale(0.880952)" fill="none" stroke="#60e0e5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m42 7 28 12v23c0 17-14 28-28 35C28 70 14 59 14 42V19Z"/><path d="m27 41 11 11 20-25"/></g><text x="890" y="555" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">Protect state and</text><text x="890" y="582" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="start">plan files.</text><text x="40" y="675" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Solid: shown relationship   ·   Dashed: illustrative / not deployed   ·   Dotted: lookup or inspection</text><text x="40" y="710" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Sensitive output redaction does not remove secrets from state. This lab uses access</text><text x="40" y="735" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">policies, not Azure RBAC; production needs role separation and purge protection.</text></svg>
