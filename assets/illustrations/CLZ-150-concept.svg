nt-size="20" font-weight="500" text-anchor="start">Variables are the public interface; locals derive values; outputs expose validation results.</text><text x="40" y="735" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">CLZ-150 remains fixed. Outputs read managed values after apply, rather than creating resources.</text></svg>
