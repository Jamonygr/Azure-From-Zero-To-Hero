00" text-anchor="start">costs.</text><text x="40" y="675" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Solid: shown relationship   ·   Dashed: illustrative / not deployed   ·   Dotted: lookup or inspection</text><text x="40" y="710" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Tags do not grant permissions or automatically copy to resources created inside a group.</text><text x="40" y="735" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">The Lab value is fixed by the lesson; environment and prefix are learner inputs.</text></svg>
