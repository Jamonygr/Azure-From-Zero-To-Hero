ejoin="round"><circle cx="42" cy="42" r="32"/><ellipse cx="42" cy="42" rx="14" ry="32"/><path d="M10 42h64M17 24h50M17 60h50"/></g><text x="565" y="278" fill="#edf4ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Traffic Manager</text><text x="565" y="303" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">Priority DNS · TTL 60</text></g><g data-node="primary"><rect x="870" y="192" width="275" height="170" rx="18" fill="#030711"/><rect x="865" y="185" width="275" height="170" rx="18" fill="url(#nodeFill)" stroke="#60e0e5" stroke-width="1.7"/><path d="M884 186H1121" stroke="#60e0e5" stroke-width="2.6" opacity="0.7"/><g transform="translate(973.5 198) scale(0.690476)" fill="none" stroke="#60e0e5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="7" width="50" height="70" rx="8"/><path d="M17 30h50M17 53h50m-37-35h2m-2 24h2m-2 23h2m12-47h15M44 42h15M44 65h15"/></g><text x="1002.5" y="268" fill="#edf4ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Primary endpoint</text><text x="1002.5" y="293" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">Existing HTTPS service ·</text><text x="1002.5" y="315" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">priority 1</text></g><g data-node="secondary"><rect x="870" y="442" width="275" height="170" rx="18" fill="#030711"/><rect x="865" y="435" width="275" height="170" rx="18" fill="url(#nodeFill)" stroke="#b39bff" stroke-width="1.7"/><path d="M884 436H1121" stroke="#b39bff" stroke-width="2.6" opacity="0.7"/><g transform="translate(973.5 448) scale(0.690476)" fill="none" stroke="#b39bff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="7" width="50" height="70" rx="8"/><path d="M17 30h50M17 53h50m-37-35h2m-2 24h2m-2 23h2m12-47h15M44 42h15M44 65h15"/></g><text x="1002.5" y="518" fill="#edf4ff" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Secondary endpoint</text><text x="1002.5" y="543" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">Existing HTTPS service ·</text><text x="1002.5" y="565" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle">priority 2</text></g><text x="40" y="675" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Solid: shown relationship   ·   Dashed: illustrative / not deployed   ·   Dotted: lookup or inspection</text><text x="40" y="710" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Traffic Manager never proxies the client connection or terminates TLS. Online probes do</text><text x="40" y="735" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">not prove the requested hostname&#x27;s certificate or host routing; the lesson owns</text><text x="40" y="760" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">registrations, not the endpoint services.</text></svg>
