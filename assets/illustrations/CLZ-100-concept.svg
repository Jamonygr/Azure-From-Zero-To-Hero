ly="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">A preview is not a deployed resource. There is no provider, backend, data source, or resource.</text><text x="40" y="735" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Read planned outputs with terraform show tfplan; terraform output reads outputs already in state.</text></svg>
