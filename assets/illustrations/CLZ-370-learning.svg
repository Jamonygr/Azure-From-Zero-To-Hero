="translate(58 497) scale(0.8809523809523809)" fill="none" stroke="#b39bff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m42 8 28 12v22c0 16-14 26-28 34C28 68 14 58 14 42V20Z"/><path d="m28 41 10 10 20-23"/></g><text x="161" y="514" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">02  Review pins and access</text><text x="161" y="547" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Keep root CI credential-free</text><path d="M95 654v19m-5-5 5 5 5-5" fill="none" stroke="#60e0e5" stroke-width="2"/><rect x="30" y="680" width="640" height="180" rx="19" fill="#111c30" stroke="#293c5c"/><circle cx="95" cy="744" r="49" fill="#12263c" stroke="#61caff"/><g transform="translate(58 707) scale(0.8809523809523809)" fill="none" stroke="#61caff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="12" width="68" height="54" rx="8"/><path d="m22 28 13 11-13 11m21 0h16"/></g><text x="161" y="724" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">03  Run offline quality checks</text><text x="161" y="757" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Validate with mocked provider data</text><path d="M95 864v19m-5-5 5 5 5-5" fill="none" stroke="#60e0e5" stroke-width="2"/><rect x="30" y="890" width="640" height="180" rx="19" fill="#111c30" stroke="#293c5c"/><circle cx="95" cy="954" r="49" fill="#12263c" stroke="#60e0e5"/><g transform="translate(58 917) scale(0.8809523809523809)" fill="none" stroke="#60e0e5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="10" width="68" height="49" rx="8"/><path d="M42 59v14m-19 0h38M18 44l13-13 10 8 22-18"/></g><text x="161" y="934" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">04  Review CI evidence</text><text x="161" y="967" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Fix failures before publishing code</text><path d="M95 1074v19m-5-5 5 5 5-5" fill="none" stroke="#60e0e5" stroke-width="2"/><rect x="30" y="1100" width="640" height="180" rx="19" fill="#111c30" stroke="#293c5c"/><circle cx="95" cy="1164" r="49" fill="#12263c" stroke="#b39bff"/><g transform="translate(58 1127) scale(0.8809523809523809)" fill="none" stroke="#b39bff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 24h46l-4 51H23Zm-6-8h58M32 16V8h20v8M33 36v24m18-24v24"/></g><text x="161" y="1144" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">05  Keep runtime data local</text><text x="161" y="1177" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Never commit plans, state, or secrets</text><text x="35" y="1345" fill="#c4d7f4" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Use the lesson commands, permissions, and verification.</text><text x="35" y="1375" fill="#c4d7f4" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Progress reports are self-reported.</text></svg>
