<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="615" viewBox="0 0 1200 615" role="img" aria-labelledby="title desc">
  <title id="title">Azure From Zero To Hero curriculum map</title>
  <desc id="desc">The 31-lesson curriculum progresses from optional workstation setup and foundations to network, Windows compute, platform, operations, and capstone. CLZ-320 consumes remote state created in CLZ-310.</desc>
  <metadata>{"preserves": "labels, coordinates, resource shapes, and service connections", "sourceSha256": "63eeae921abd20950188df9810ea3f872b82c18253421e031576a2f7e75c00a4"}</metadata><style>.bg{fill:#080e1b}.lane{fill:#101d32;stroke:#cbd5e1;stroke-width:2}.step{fill:#172747;stroke:#61caff;stroke-width:3}.adv{fill:#11332f;stroke:#60e0e5;stroke-width:3}.dep{fill:#30233a;stroke:#b39bff;stroke-width:2}.arrow{stroke:#b39bff;stroke-width:3;fill:none}.text{font:700 23px "Segoe UI",Arial,sans-serif;fill:#eff5ff}.small{font:17px "Segoe UI",Arial,sans-serif;fill:#bcd0eb}.tiny{font:15px "Segoe UI",Arial,sans-serif;fill:#bcd0eb}</style>
  <rect class="bg" width="1200" height="520" rx="18" />
  <text class="text" x="40" y="55">31-Lesson Learning Path</text>
  <rect class="lane" x="60" y="95" width="1080" height="360" rx="16" />
  <g transform="translate(95 135)">
    <rect class="step" width="180" height="95" rx="12" /><text class="text" x="36" y="42">090-160</text><text class="small" x="30" y="70">foundations</text>
    <rect class="step" x="210" width="180" height="95" rx="12" /><text class="text" x="247" y="42">170-180</text><text class="small" x="258" y="70">network</text>
    <rect class="step" x="420" width="180" height="95" rx="12" /><text class="text" x="457" y="42">190-270</text><text class="small" x="462" y="70">Windows</text>
    <rect class="adv" x="630" width="180" height="95" rx="12" /><text class="text" x="667" y="42">280-350</text><text class="small" x="665" y="70">platform</text>
    <rect class="adv" x="840" width="180" height="95" rx="12" /><text class="text" x="877" y="42">360-390</text><text class="small" x="875" y="70">operate</text>
  </g>
  <text class="small" x="95" y="285">Explicit cross-lesson state exercise</text>
  <rect class="dep" x="320" y="310" width="200" height="70" rx="10" />
  <text class="text" x="371" y="342">CLZ-310</text>
  <text class="tiny" x="349" y="365">backend producer</text>
  <line class="arrow" x1="535" y1="345" x2="665" y2="345" />
  <polygon points="665,345 647,335 647,355" fill="#b39bff" />
  <rect class="dep" x="680" y="310" width="200" height="70" rx="10" />
  <text class="text" x="731" y="342">CLZ-320</text>
  <text class="tiny" x="716" y="365">state consumer</text>
  <text class="tiny" x="95" y="425">Other deployable lessons own their lifecycle; local/readiness lessons create no Azure resources.</text>
<g><rect y="520.0" width="1200.0" height="95" fill="#080e1b" /><g transform="translate(25 533.0) scale(0.75)" fill="none" stroke="#60e0e5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M24 60h39c25 0 25-34 2-37-8-24-40-22-46 1C-3 30 0 60 24 60Z" /><path d="m30 40 12 12 15-22" /></g><g transform="translate(112 533.0) scale(0.75)" fill="none" stroke="#b39bff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><rect x="29" y="29" width="26" height="26" rx="5" /><path d="M42 29V12m0 43v17M29 42H12m43 0h17" /><circle cx="42" cy="9" r="5" /><circle cx="42" cy="75" r="5" /><circle cx="9" cy="42" r="5" /><circle cx="75" cy="42" r="5" /></g><text x="210" y="562.0" fill="#eaf2ff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="500">Azure + Terraform learning architecture</text><text x="210" y="590.0" fill="#bdd0ec" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">Follow the lesson for exact resource settings and deployment mode.</text></g></svg>
